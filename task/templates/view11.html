<!DOCTYPE html>
<html lang="zh-CN">
<head>
{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明镜案件质量评查辅助系统</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">

<style>
@font-face {
    font-family: "FZZJ-LongYTJW";
    src: url("{% static 'task/images/FZZJ-LongYTJW.woff2' %}") format("woff2"),
         url("{% static 'task/images/FZZJ-LongYTJW.ttf' %}") format("truetype");
    font-weight: normal;
    font-style: normal;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #eef1f5;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
}

/* ===== 头部 ===== */
header {
    height: 350px;
    display: flex;
    position: relative;
}

/* 左上角党徽 */
.party-logo {
    position: absolute;
    top: 25px;
    left: 35px;
    width: 70px;
    z-index: 10;
}

.party-logo img {
    width: 100%;
}

/* 左侧蓝色区域 */
.header-left {
    width: 50%;
    background: #0F4C81;
    display: flex;
    align-items: center;
    padding-left: 120px;
}

/* 标题内容 靠左对齐 */
.header-content {
    text-align: left;
}

/* 明镜：放大两号 */
.art-font {
    display: block;
    font-family: "FZZJ-LongYTJW", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 96px;
    font-weight: normal;
    color: #ffffff;
    letter-spacing: 6px;
    margin-bottom: 8px;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
}

/* 主标题 微软雅黑 放大两号 */
.header-title {
    font-family: "Microsoft YaHei", sans-serif;
    font-size: 54px;
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 2px;
}

/* ===== 右侧图片 ===== */
.header-right {
    width: 50%;
    position: relative;
    background: url("{% static 'task/images/img1.png' %}") no-repeat center;
    background-size: cover;
}

.header-right::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 220px;
    height: 100%;
    background: linear-gradient(
        to right,
        #0F4C81 0%,
        #0F4C81 65%,
        rgba(15,76,129,0.5) 80%,
        rgba(15,76,129,0) 100%
    );
}

/* ===== 主体 ===== */
main {
    height: calc(100vh - 350px - 40px);
    padding: 30px;
    display: grid;
    grid-template-columns: 4fr 3fr 3fr;
    gap: 25px;
}

.column {
    background: #ffffff;
    border-radius: 8px;
    padding: 28px;
    border: 1px solid #e4e7ed;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
}

.section-title {
    font-size: 1.4rem;
    font-weight: 600;
    color: #1f3a5f;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
}

.section-title::before {
    content: "";
    width: 4px;
    height: 16px;
    background-color: #c9a86a;
    margin-right: 10px;
}

.card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    flex: 1;
}

.single-card {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.card {
    background: #fafbfc;
    border-radius: 8px;
    padding: 25px 15px;
    text-align: center;
    cursor: pointer;
    border: 1px solid #e6e8eb;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.card:hover {
    border-color: #1f3a5f;
    box-shadow: 0 4px 10px rgba(31,58,95,0.08);
}

.icon {
    width: 48px;
    height: 48px;
    margin-bottom: 12px;
    position: relative;
}

.icon-book::before, .icon-book::after {
    content: "";
    position: absolute;
    background-color: #1f3a5f;
}
.icon-book::before {
    width: 36px;
    height: 32px;
    left: 6px;
    top: 8px;
    border-radius: 2px 0 0 2px;
}
.icon-book::after {
    width: 4px;
    height: 32px;
    left: 24px;
    top: 8px;
    background-color: #fff;
}

.icon-file::before, .icon-file::after {
    content: "";
    position: absolute;
    background-color: #1f3a5f;
}
.icon-file::before {
    width: 32px;
    height: 40px;
    left: 8px;
    top: 4px;
    border-radius: 2px;
}
.icon-file::after {
    width: 12px;
    height: 12px;
    right: 8px;
    top: 4px;
    background-color: #fff;
    border-radius: 0 2px 0 0;
}

.icon-shield {
    width: 40px;
    height: 44px;
    background-color: #1f3a5f;
    clip-path: polygon(50% 0%, 100% 15%, 100% 60%, 50% 100%, 0% 60%, 0% 15%);
}

.icon-clipboard::before, .icon-clipboard::after {
    content: "";
    position: absolute;
    background-color: #1f3a5f;
}
.icon-clipboard::before {
    width: 32px;
    height: 36px;
    left: 8px;
    top: 8px;
    border-radius: 2px;
}
.icon-clipboard::after {
    width: 20px;
    height: 8px;
    left: 14px;
    top: 4px;
    border-radius: 2px 2px 0 0;
}

.icon-check {
    width: 36px;
    height: 36px;
    border: 4px solid #1f3a5f;
    border-radius: 4px;
    position: relative;
}
.icon-check::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 20px;
    left: 10px;
    top: 4px;
    border-right: 4px solid #1f3a5f;
    border-bottom: 4px solid #1f3a5f;
    transform: rotate(45deg);
}

.icon-location {
    width: 32px;
    height: 40px;
    background-color: #1f3a5f;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    position: relative;
}
.icon-location::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    background-color: #fff;
    border-radius: 50%;
    left: 10px;
    top: 10px;
}

.icon-desktop::before, .icon-desktop::after {
    content: "";
    position: absolute;
    background-color: #1f3a5f;
}
.icon-desktop::before {
    width: 40px;
    height: 28px;
    left: 4px;
    top: 6px;
    border-radius: 4px 4px 0 0;
}
.icon-desktop::after {
    width: 24px;
    height: 6px;
    left: 12px;
    top: 36px;
    border-radius: 0 0 4px 4px;
}

.card span {
    font-size: 1.3rem;
    color: #2c3e50;
    font-weight: 500;
}

.card-full {
    grid-column: span 2;
}

.function-card-grid {
    grid-template-rows: 1fr;
}

.function-card-grid .card {
    padding: 40px 15px;
}

.copyright {
    height: 40px;
    line-height: 40px;
    text-align: center;
    font-size: 16px;
    color: rgba(0,0,0,0.45);
    letter-spacing: 1px;
}
</style>
</head>

<body>

<header>
    <div class="party-logo">
        <img src="{% static 'task/images/party-logo__2_-removebg-preview.png' %}" alt="党徽">
    </div>

    <div class="header-left">
        <div class="header-content">
            <span class="art-font">明镜</span>
            <div class="header-title">案件质量评查辅助系统</div>
        </div>
    </div>

    <div class="header-right"></div>
</header>

<main>
    <div class="column">
        <div class="section-title">知识区</div>
        <div class="card-grid">
            <div class="card" onclick="location.href='/external_link/'">
                <div class="icon icon-book"></div>
                <span>法律法规库</span>
            </div>
            <div class="card" onclick="location.href='/external_link1/'">
                <div class="icon icon-file"></div>
                <span>典型案例</span>
            </div>
            <div class="card card-full" onclick="location.href='/external_link2/'">
                <div class="icon icon-shield"></div>
                <span>审查标准规范</span>
            </div>
        </div>
    </div>

    <div class="column">
        <div class="section-title">功能区</div>
        <div class="card-grid function-card-grid">
            <div class="card" onclick="location.href='/index/?status=pending'">
                <div class="icon icon-clipboard"></div>
                <span>案件评查</span>
            </div>
            <div class="card" onclick="location.href='/result/'">
                <div class="icon icon-check"></div>
                <span>结果复核</span>
            </div>
        </div>
    </div>

    <div class="column single-card">
        <div class="section-title">管理区</div>
        <div class="card" onclick="location.href='/system_intro/'">
            <div class="icon icon-location"></div>
            <span>系统介绍</span>
        </div>
        <div class="card" onclick="location.href='/feedback/'">
            <div class="icon icon-desktop"></div>
            <span>意见反馈</span>
        </div>
    </div>
</main>

<!-- <div class="copyright">版权所有：驻江西厅纪检组</div> -->

</body>
</html>
